name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "new-version/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Flutter compiles to a prebuilt web bundle committed at new-version/public/
  # rather than being built on the server - so a source-only change under
  # frontend/ has zero effect until something rebuilds and recommits that
  # bundle. This job does that automatically on every push, instead of
  # relying on a human remembering to run build-frontend.sh first.
  rebuild-frontend:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: new-version/frontend
        run: |
          flutter pub get
          flutter build web

      - name: Sync build output into public/
        working-directory: new-version
        run: |
          rm -rf public/*
          cp -r frontend/build/web/* public/

      - name: Commit rebuilt bundle if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- new-version/public; then
            git add new-version/public
            git commit -m "chore: rebuild flutter web bundle [skip ci]"
            # A concurrent push to main (e.g. someone pushing a follow-up
            # commit while this job is running) rejects a plain push here -
            # rebase onto the latest main and retry rather than failing the
            # whole job over an ordinary race.
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing onto latest origin/main and retrying"
              git fetch origin main
              git rebase origin/main
              if [ "$i" = 5 ]; then
                echo "::error::Could not push rebuilt bundle after 5 attempts"
                exit 1
              fi
            done
          fi

      - name: Resolve deployed sha
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: rebuild-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: msouthwick.com
          username: matthias
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Inline rather than a checked-in script: a script file on disk
          # can't deploy itself the first time it exists. `git pull` is
          # deliberately not used here - that's a merge, and it's exactly
          # what produced the "divergent branches" failure last time. A
          # deploy box should always become exactly what's on the remote.
          script: |
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd /home/matthias/Github/familyapp-new/familyapp
            before="$(git rev-parse HEAD)"
            git fetch origin main
            # -B (re)creates local main pointing at origin/main; -f discards
            # any dirty tracked files instead of refusing like a plain
            # `checkout` would (hit this for real: someone had hand-edited
            # server.sh directly on the box without committing it).
            git checkout -f -B main origin/main
            after="$(git rev-parse HEAD)"
            git rev-parse --short HEAD > new-version/.deploy-sha

            cd new-version
            if ! git diff --quiet "$before" "$after" -- bun.lock prisma/schema.prisma; then
              echo "bun.lock or schema changed - installing dependencies"
              bun install --frozen-lockfile
            fi
            if ! git diff --quiet "$before" "$after" -- prisma/schema.prisma; then
              echo "prisma schema changed - regenerating client and pushing schema"
              # Run the exact version bun.lock installed, not `bunx prisma`,
              # which resolves against the npm registry and can silently
              # grab an incompatible newer major with a different CLI.
              ./node_modules/.bin/prisma generate
              ./node_modules/.bin/prisma db push --skip-generate
            fi

            sudo systemctl restart familyn.service

      - name: Verify deployed version
        run: |
          expected="$(echo '${{ needs.rebuild-frontend.outputs.sha }}' | cut -c1-7)"
          for i in $(seq 1 10); do
            resp="$(curl -fsS https://familyn.msouthwick.com/version || true)"
            echo "Got: $resp"
            if echo "$resp" | grep -q "$expected"; then
              echo "Deploy verified: $resp"
              exit 0
            fi
            sleep 3
          done
          echo "::error::familyn.msouthwick.com/version never reported commit $expected after deploy"
          exit 1
